[project]
name = "AzureSnowBot"
version = "0.1.0"
description = "AzureSnow QQ Bot powered by NoneBot2 + NapCat"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.4.4,<3",
    "nonebot-adapter-onebot>=2.4.6,<3",
    "httpx>=0.28.1,<0.29",
    "Pillow>=12.0,<14",
    "mcp>=1.26,<2",
    "PyJWT>=2.12.1,<3",
    "bcrypt>=5,<6",
    "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["botcore*", "plugins*"]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = []
plugin_dirs = ["plugins"]
